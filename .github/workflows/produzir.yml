name: Produzir Reels (estúdio)

# Roda sob demanda: você escolhe os episódios e o GitHub gera voz + vídeo.
# Nada é publicado aqui. O MP4 volta como artefato e é commitado em reels/.

on:
  workflow_dispatch:
    inputs:
      episodios:
        description: "IDs separados por vírgula (ex.: EP-001,EP-002). Vazio = todos os pendentes."
        required: false
        default: ""
      voz:
        description: "Voz da narração (Kokoro PT-BR)"
        required: false
        default: "pf_dora"
        type: choice
        options:
          - pf_dora
          - pm_alex
          - pm_santa

concurrency:
  group: sabioefeliz-estudio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências de sistema (Manim precisa de cairo e pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu-core
          sudo apt-get install -y fonts-google-poppins || {
            mkdir -p ~/.fonts
            curl -sSL -o ~/.fonts/Poppins-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf"
            curl -sSL -o ~/.fonts/Poppins-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf"
            fc-cache -f
          }
          fc-list | grep -i poppins || echo "AVISO: Poppins não instalada; o Manim vai usar a fonte padrão"

      - run: pip install -r requirements.txt -r requirements-estudio.txt

      - name: Reaproveitar o modelo de voz entre execuções
        uses: actions/cache@v4
        with:
          path: modelos
          key: kokoro-v1.0

      - name: Renderizar
        run: |
          if [ -z "${{ inputs.episodios }}" ]; then
            python -m estudio.produzir --pendentes --voz "${{ inputs.voz }}"
          else
            ARGS=""
            IFS=',' read -ra IDS <<< "${{ inputs.episodios }}"
            for id in "${IDS[@]}"; do ARGS="$ARGS --id $(echo $id | xargs)"; done
            python -m estudio.produzir $ARGS --voz "${{ inputs.voz }}"
          fi

      - name: Guardar os MP4 como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels-${{ github.run_id }}
          path: |
            reels/*.mp4
            output/**/producao.json
          retention-days: 30

      - name: Commitar os Reels produzidos
        run: |
          git config user.name "estudio-sabio"
          git config user.email "actions@github.com"
          git add reels conteudo/fila.json
          git diff --cached --quiet || git commit -m "estúdio: novos Reels produzidos [skip ci]"
          git push
