name: Limpar mídia com recibo confirmado
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: confirmed-media-pruning
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/prune_confirmed.py --apply
      - name: Preservar histórico e remover somente arquivos confirmados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u reels/
          git diff --cached --quiet && exit 0
          git commit -m 'Limpeza de mídia com recibo e margem de sete dias [skip ci]'
          git pull --rebase && git push
