name: QA acabamento nativo CPU
on:
  pull_request:
    branches: [main]
    paths:
      - tools/native_video_finisher.py
      - tools/test_native_finisher.py
      - estudio/produzir.py
      - .github/workflows/qa-native-video.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg local e Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install Pillow
      - name: Validar geracao de MP4 e preservacao da voz
        env:
          NATIVE_TEST_VIDEO: '1'
        run: python -m unittest discover -s tools -p test_native_finisher.py -v
