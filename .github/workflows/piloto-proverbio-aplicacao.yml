name: Piloto — provérbio aplicado (não publicar)

on:
  push:
    branches:
      - piloto/proverbio-aplicacao-20261111
    paths:
      - "pilotos/**"
      - ".github/workflows/piloto-proverbio-aplicacao.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabio-piloto-aplicacao
  cancel-in-progress: false

jobs:
  renderizar_piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verificar o roteiro (sem produção)
        run: python -m pilotos.proverbio_aplicacao --roteiro

      - name: Dependências do estúdio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu-core
          pip install -r requirements.txt -r requirements-estudio.txt

      - uses: ./.github/actions/setup-hyperframes

      - name: Cache do modelo de voz original
        uses: actions/cache@v4
        with:
          path: modelos
          key: kokoro-v1.0

      - name: Renderizar MP4 com Seu Ranzinza, Kokoro e HyperFrames
        env:
          PUBLICAR_ATIVO: "false"
          DRY_RUN: "true"
        run: python -m pilotos.proverbio_aplicacao

      - name: Arquivar piloto para revisão (sem Instagram)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-sabio-proverbio-aplicado
          path: |
            output/pilotos/proverbio-aplicacao/*.mp4
            output/pilotos/proverbio-aplicacao/resultado.json
          if-no-files-found: warn
          retention-days: 3
