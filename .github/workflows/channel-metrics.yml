name: Métricas confirmadas de 24h e 72h
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: channel-metrics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar somente métricas de mídias confirmadas
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID_SABIO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_SABIO }}
        run: python tools/channel_ops.py --account sabioefeliz
      - name: Preservar medições
        run: |
          [ -f data/channel_metrics.json ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/channel_metrics.json
          git diff --cached --quiet && exit 0
          git commit -m 'Métricas de publicações confirmadas [skip ci]'
          git pull --rebase && git push
