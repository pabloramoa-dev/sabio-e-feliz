name: Vigia da fila

# O agendamento do GitHub pode atrasar ou não rodar. Este vigia confere se a
# reserva de Reels OU de carrosséis aprovados está acabando e abre uma issue.

on:
  schedule:
    - cron: "30 9 * * *"    # todos os dias, 06:30 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          python -m src.conferir --resumo >> $GITHUB_OUTPUT || true
      - name: Abrir aviso se a reserva estiver baixa
        if: steps.check.outputs.reserva_baixa == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Reserva de conteúdo acabando",
              body: `Reels aprovados na fila: ${{ steps.check.outputs.aprovados }}\nCarrosséis disponíveis para a tarde: ${{ steps.check.outputs.carrosseis_disponiveis }}\n\nO reabastecimento automático roda diariamente. Se a reserva continuar baixa, confira o workflow **Reabastecer o canal (piloto automático)** e os logs do estúdio.`
            })
